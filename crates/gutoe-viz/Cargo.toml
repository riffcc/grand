[package]
name = "gutoe-viz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Live GUTOE Cl(1,3) lattice visualizer — wgpu hex grid"

[[bin]]
name = "gutoe-viz"
path = "src/main.rs"

[dependencies]
wgpu       = "22"
winit      = "0.30"
bytemuck   = { version = "1", features = ["derive"] }
rand       = { workspace = true }
log        = "0.4"
env_logger = "0.11"
pollster   = "0.3"
