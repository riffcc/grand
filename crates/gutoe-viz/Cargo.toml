[package]
name = "gutoe-viz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "wgpu-powered GUTOE quantum experiment visualizer"

[[bin]]
name = "gutoe-viz"
path = "src/main.rs"

[dependencies]
wgpu = "22"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
gutoe-physics = { path = "../gutoe-physics" }
