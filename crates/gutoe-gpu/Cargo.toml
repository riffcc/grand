[package]
name = "gutoe-gpu"
version.workspace = true
edition.workspace = true
description = "GPU-accelerated Schrodinger solver for GUTOE (CUDA + ROCm via HIP)"

[dependencies]
gutoe-em = { path = "../gutoe-em" }
gutoe-physics = { path = "../gutoe-physics" }
num-complex.workspace = true
rayon = "1"

# Interactive black hole viewer (bh_viewer binary)
wgpu       = "22"
winit      = "0.30"
bytemuck   = { version = "1", features = ["derive"] }
pollster   = "0.3"
log        = "0.4"
env_logger = "0.11"
gilrs      = "0.10"
image      = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# No GPU kernel crate dependencies here — the kernels are compiled separately
# and linked via build.rs. This keeps the CPU fallback always available.

[[bin]]
name = "bh_viewer"
path = "src/bin/bh_viewer.rs"

[[bin]]
name = "bh_render"
path = "src/bin/bh_render.rs"

[[bin]]
name = "bh_kerr_report"
path = "src/bin/bh_kerr_report.rs"

[[bin]]
name = "fusion_viewer"
path = "src/bin/fusion_viewer.rs"

[features]
default = []
cuda  = []   # NVIDIA CUDA: compile kernels with nvcc
rocm  = []   # AMD ROCm: compile kernels with hipcc (same kernel source)
# To enable: cargo build --features cuda
#            cargo build --features rocm
